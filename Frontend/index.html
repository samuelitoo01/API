<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="layout/app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <app-layout class="w-full">
        <div class="flex items-center justify-center pb-20">
            <div class="bg-white rounded-lg shadow-xl px-8 py-10 w-full max-w-md">
                <div class="flex flex-col justify-center items-center mb-8">
                    <h1 class="text-2xl font-normal text-gray-900 text-center mb-2">
                        Registra un nuevo usuario
                    </h1>
                    <small class="text-xs text-center text-gray-500">Todos los campos son obligatorios</small>
                </div>
                <form class="space-y-4">
                    <div>
                        <label for="username" class="block text-xs text-gray-700 mb-1">
                            Nombre de usuario
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required 
                            class="input-name w-full px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-400 transition text-sm"
                            placeholder="tu_usuario"
                        >
                    </div>

                    <div>
                        <label for="email" class="block text-xs text-gray-700 mb-1">
                            Correo electrónico
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            class="input-email w-full px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-400 transition text-sm"
                            placeholder="tu@correo.com"
                        >
                    </div>

                    <button 
                        type="submit" 
                        class="btn-add-student w-full py-1.5 bg-gray-900 text-white font-medium rounded-lg 
                        hover:bg-gray-800 transition duration-200 cursor-pointer text-sm mt-3"
                    >
                        Registrarse
                    </button>
                </form>
            </div>
        </div> 
    <div class="container-base-datos">
        
    </div>
    </app-layout>

    <!--Contenedor para renderizar los datos de la base de datos -->

   
<script src="./js/main.js" type="module"></script>
</body>
</html>
