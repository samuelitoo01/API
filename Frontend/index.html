<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Estudiantes del colegio Mariano Ospina Rodriguez</title>
</head>
<body>
    <div class="mt-4 mb-4">
        <h1 class="text-2xl text-center">Estudiantes del colegio Mariano Ospina Rodriguez</h1>
        <h1 class="text-center text-gray-600">Agregar esudiantes a la base datos </h1>
    </div>


    <!---formulario para agregar estudiantes a la base datos -->

    <div class="add-student-container flex flex-col justify-center items-center py-8 px-4">
        <div class="w-full max-w-md">            
            <label for="name" class="block mb-6">
                <input type="text" id="name" placeholder="Nombre" class="input-name w-full px-0 py-2 border-b border-gray-300 focus:outline-none focus:border-gray-800 transition text-sm">
            </label>

            <label for="lastname" class="block mb-8">
                <input type="text" id="lastname" placeholder="Apellido" class="input-lastname w-full px-0 py-2 border-b border-gray-300 focus:outline-none focus:border-gray-800 transition text-sm">
            </label>

            <button class="btn-add-student w-full bg-gray-900 text-white py-2.5 text-sm font-light tracking-wide hover:bg-gray-800 transition">AGREGAR</button>
        </div>
    </div>

    <div class="container">
        <div class="student-container">
           

        </div>
    </div>



    

    <script src="./js/main.js" type="module"></script>
</body>
</html>
